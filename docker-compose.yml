version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authentik-login-designer-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:casmarts_secure_db_pwd_2026@db-primary:5432/authentik_login_manager
      VALKEY_URL: redis://cache:6379/1
      CORS_ORIGINS: http://localhost:3000,https://auth.casmart.internal,https://logindesigner.casmart.internal,http://localhost:80
      ADMIN_API_KEY: casmarts_admin_super_secret_key_123
      PUBLIC_API_BASE_URL: https://auth.casmart.internal
      # Misma instancia de Authentik que authentik-login-manager — solo para
      # el editor de política de contraseña. Token real vía .env (gitignored),
      # nunca hardcodeado aquí (a diferencia de ADMIN_API_KEY arriba, que ya
      # era una práctica preexistente y no se tocó en este cambio).
      AUTHENTIK_HOST: http://casmarts-core-authentik-server:9000
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN}
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - identity-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: authentik-login-designer-frontend
    ports:
      - "3000:80"
    restart: always
    networks:
      - identity-network

networks:
  identity-network:
    name: identity-network
    external: true
