version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authentik-login-designer-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: redis://cache:6379/1
      CORS_ORIGINS: http://localhost:3000,https://auth.casmart.internal,https://logindesigner.casmart.internal,http://localhost:80
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      PUBLIC_API_BASE_URL: https://auth.casmart.internal
      # Misma instancia de Authentik que authentik-login-manager — solo para
      # el editor de política de contraseña. Token real vía .env (gitignored),
      # nunca hardcodeado aquí (a diferencia de ADMIN_API_KEY arriba, que ya
      # era una práctica preexistente y no se tocó en este cambio).
      AUTHENTIK_HOST: http://casmarts-core-authentik-server:9000
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN}
      # Secreto del webhook de eventos reales (routers/authentik_events.py) —
      # debe coincidir con el configurado en el NotificationTransport de
      # Authentik que apunta a este backend.
      AUTHENTIK_WEBHOOK_SECRET: ${AUTHENTIK_WEBHOOK_SECRET:-}
      # SMTP para correos de prueba y correos reales disparados por eventos.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    # Sin publicar en el host: el gateway lo alcanza via DNS de Docker
    # (authentik-login-designer-backend:8000 en identity-network). Publicarlo
    # en 0.0.0.0:8000 permitía saltarse el gateway (sin TLS) por completo —
    # hallazgo de la auditoría 2026-07-06 (mismo patrón que el manager, cuyo
    # backend ya tenía esto comentado).
    restart: always
    volumes:
      - ./backend:/app
      - ../core-casmarts/data/authentik/custom-templates:/shared/authentik/templates
      # Necesario para _push_favicon_to_authentik_brand (Fase 1 de la
      # paridad con Manager): ahí se escribe el favicon.* que luego se
      # referencia en authentik_brands_brand.branding_favicon.
      - ../core-casmarts/data/authentik/media/public:/shared/authentik/media/public
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - identity-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: authentik-login-designer-frontend
    ports:
      - "3000:80"
    restart: always
    networks:
      - identity-network

networks:
  identity-network:
    name: identity-network
    external: true
